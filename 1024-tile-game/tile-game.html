<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>2048 Tile Game</title>
	<style>
		body {
			display: flex;
			align-items: center;
			justify-content: center;
			height: 98vh;
			column-gap: 20px;
		}
		.grids {
			display: grid;
			grid-template-columns: repeat(4, 80px);
			grid-template-rows: repeat(4, 80px);
		}
		.cell {
			border: 1px solid black;
			/* height: 30px;
			width: 30px;
			display: flex; */
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 35px;
			font-family: Arial, Helvetica, sans-serif;
		}
		.buttons {
			display: grid;
			grid-template-columns: repeat(3, 40px);
			grid-template-rows: repeat(2, 40px);
			/* border: 1px solid black; */
			& button {
				cursor: pointer;
			}
		}
	</style>
</head>
<body>
	<div class="grids"></div>
	<div class="buttons">
		<div></div>
		<button onclick="
			moveUp();
		" class="w">W</button>
		<div></div>
		<button onclick="
			moveLeft();
		" class="a">A</button>
		<button onclick="
			moveDown();
		" class="s">S</button>
		<button onclick="
			moveRight();
		" class="d">D</button>
	</div>

	printGrid();
	function printGrid() {
		let html = '';
		let num = 0;

		grids.forEach((grid) => {
			grid.forEach(rid => {
				html += `
					<div class="cell cell${num++}">${rid}</div>
				`;
			})
		})
		document.querySelector('.grids').innerHTML = html;
	}

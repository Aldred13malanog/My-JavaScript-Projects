<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Calendar</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="calendar">
		<div class="month-year">
			<div class="month"></div>
			<div class="buttons">
				<button class="prev">&#8249;</button>
				<button class="next">&#8250;</button>
			</div>
			<div class="year"></div>
		</div>
		<div class="mtwtfss">
			<div>Sunday</div>
			<div>Monday</div>
			<div>Tuesday</div>
			<div>Wednesday</div>
			<div>Thursday</div>
			<div>Friday</div>
			<div>Saturday</div>
		</div>
		<div class="days"></div>
	</div>
	
	<script src="script.js"></script>
</body>
</html>
